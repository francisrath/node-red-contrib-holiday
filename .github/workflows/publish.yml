name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm >= 11.5.1; the bundled npm can lag behind
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish
