<script type="text/javascript">
    RED.nodes.registerType('holiday', {
        category: 'function',
        color: '#a6bbcf',
        defaults: {
            name: { value: "" },
            country: { value: "", required: true },
            state: { value: "" },
            region: { value: "" },
            timezone: { value: "" },
            languages: { value: "" },
            typePublic: { value: true },
            typeBank: { value: true },
            typeSchool: { value: true },
            typeObservance: { value: false },
            typeOptional: { value: false },
            weekend: { value: "6,0" } // Saturday and Sunday
        },
        inputs: 1,
        inputLabels: ['timestamp'],
        outputs: 2,
        outputLabels: ['Is holiday', 'Is not holiday'],
        icon: "font-awesome/fa-calendar",
        label: function () {
            return this.name || "holiday";
        },
        oneditprepare: function () {
            var saved = { country: this.country, state: this.state, region: this.region };
            var downstream = { country: ['state', 'region'], state: ['region'], region: [] };

            $("#weekend-row input[type=checkbox]").removeAttr("checked");
            this.weekend.split(",").forEach(function (v) {
                $("#weekend-row [value=" + v + "]").prop("checked", true);
            });

            // Back to the plain text box this field used to be. A dropdown that
            // can't be filled is worse than one you type the code into yourself.
            function asText(id) {
                var $field = $('#node-input-' + id);
                if (!$field.is('select'))
                    return;

                $field.replaceWith($('<input type="text">')
                    .attr({ id: 'node-input-' + id, placeholder: $field.attr('placeholder') })
                    .val(saved[id] || ''));
            }

            // Fill one dropdown from the runtime. No params means there is nothing
            // to offer yet — no country picked, so no states to list.
            function fill(id, params, selected, next) {
                var $field = $('#node-input-' + id);

                if (!$field.is('select'))
                    return next && next();

                if (!params) {
                    $field.empty().append($('<option>').val(''));
                    return next && next();
                }

                $.getJSON('holiday/places', params).done(function (found) {
                    $field.empty().append($('<option>').val(''));

                    Object.keys(found).sort(function (a, b) {
                        return found[a].localeCompare(found[b]);
                    }).forEach(function (code) {
                        $field.append($('<option>').val(code).text(found[code] + ' \u2014 ' + code));
                    });

                    // A code the database no longer lists still belongs in the list,
                    // so an existing flow keeps showing what it is actually set to.
                    if (selected && !found[selected])
                        $field.append($('<option>').val(selected).text(selected));

                    $field.val(selected || '');

                    if (next)
                        next();
                }).fail(function () {
                    asText(id);
                    downstream[id].forEach(asText);
                });
            }

            var states = function (country) { return country ? { country: country } : null; };
            var regions = function (country, state) { return country && state ? { country: country, state: state } : null; };

            fill('country', {}, saved.country, function () {
                fill('state', states(saved.country), saved.state, function () {
                    fill('region', regions(saved.country, saved.state), saved.region);
                });

                // Picking a country rules out whatever state was selected under the old one.
                $('#node-input-country').on('change', function () {
                    fill('state', states($(this).val()), '', function () {
                        fill('region', null, '');
                    });
                });

                $('#node-input-state').on('change', function () {
                    fill('region', regions($('#node-input-country').val(), $(this).val()), '');
                });
            });
        },
        oneditsave: function () {
            var days = $('#weekend-row input[type=checkbox]:checked').map(function (_, el) {
                return $(el).val()
            }).get();

            if (days.length == 0)
                this.weekend = "";
            else
                this.weekend = days.join(",");
        }
    });
</script>

<script type="text/html" data-help-name="holiday">
    <p>Tells you whether a given time falls on a holiday or a weekend, using the
       <a href="https://github.com/commenthol/date-holidays" target="_blank">date-holidays</a> database.</p>

    <h3>Input</h3>
    <dl class="message-properties">
        <dt>payload<span class="property-type">date | number | string</span></dt>
        <dd>The date to check &mdash; <b>not</b> the current time. An inject node's
            timestamp works as-is.</dd>
    </dl>

    <h3>Outputs</h3>
    <ol class="node-ports">
        <li>Holiday or weekend
            <dl class="message-properties">
                <dt>holiday<span class="property-type">object</span></dt>
                <dd>The match, with <code>name</code>, <code>type</code> and the start/end of the day.
                    Only set on an actual holiday.</dd>
                <dt>holidays<span class="property-type">array</span></dt>
                <dd>Every match for that date. Some dates are two holidays at once &mdash;
                    19 June in Texas is both Juneteenth and Emancipation Day.</dd>
                <dt>weekend<span class="property-type">boolean</span></dt>
                <dd>Set to <code>true</code> when the day is one of the days ticked as weekend.</dd>
            </dl>
        </li>
        <li>Neither
            <dl class="message-properties">
                <dd>The message passes through untouched.</dd>
            </dl>
        </li>
    </ol>

    <h3>Details</h3>
    <p><b>Country</b>, <b>State</b> and <b>Region</b> are filled from the holiday database, so
       you pick a country by name rather than remembering its code. State lists only what the
       chosen country has, region only what the chosen state has &mdash; many have neither.
       A flow set to a code the database has since dropped keeps showing that code.</p>
    <p>Leaving <b>every</b> holiday type unticked is the same as ticking them all &mdash; that is
       how the underlying library behaves. To match weekends only, untick every type and pick a
       country with no holidays you care about, or filter downstream on <code>msg.holiday</code>.</p>
    <p><b>Timezone</b> defaults to the country's own, which is usually what you want: it decides
       both which day a holiday falls on and which day counts as the weekend. Set it explicitly if
       your Node-RED runs somewhere other than the country you're asking about.</p>
    <p>A payload that isn't a date, or an unknown country or timezone, raises an error you can
       catch with a catch node rather than quietly reporting "not a holiday".</p>
</script>
